<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eleven Million Lines — Reader</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 18px; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #fdfaf5;
      color: #1a1a1a;
      line-height: 1.7;
      max-width: 720px;
      margin: 0 auto;
      padding: 4rem 2rem 6rem;
    }
    .nav {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 3rem;
      display: flex;
      gap: 1.5rem;
    }
    .nav a { color: #555; text-decoration: none; }
    .nav a:hover { text-decoration: underline; }
    #content h1 { font-size: 1.8rem; font-weight: normal; margin-bottom: 1.5rem; line-height: 1.2; }
    #content h2 { font-size: 1.2rem; font-weight: bold; margin: 2.5rem 0 0.75rem; }
    #content h3 { font-size: 1rem; font-weight: bold; margin: 2rem 0 0.5rem; }
    #content p { margin-bottom: 1.2rem; color: #333; }
    #content ul, #content ol { margin: 0 0 1.2rem 1.5rem; color: #333; }
    #content li { margin-bottom: 0.4rem; }
    #content code {
      font-family: "Courier New", monospace;
      font-size: 0.85em;
      background: #f0ece4;
      padding: 0.1em 0.35em;
      border-radius: 2px;
    }
    #content pre {
      background: #f0ece4;
      padding: 1.25rem;
      overflow-x: auto;
      margin-bottom: 1.5rem;
      border-left: 3px solid #c8bfb0;
    }
    #content pre code { background: none; padding: 0; font-size: 0.82em; }
    #content blockquote {
      border-left: 3px solid #c8bfb0;
      padding-left: 1.25rem;
      color: #666;
      margin-bottom: 1.2rem;
    }
    #content hr { border: none; border-top: 1px solid #e0d8cc; margin: 2.5rem 0; }
    #content strong { color: #1a1a1a; }
    #content em { font-style: italic; }
    #content a { color: #555; }
    #content table { border-collapse: collapse; width: 100%; margin-bottom: 1.5rem; font-size: 0.9rem; }
    #content th, #content td { border: 1px solid #e0d8cc; padding: 0.5rem 0.75rem; text-align: left; }
    #content th { background: #f0ece4; font-weight: bold; }
    .error { color: #a00; font-style: italic; }
    .loading { color: #888; font-style: italic; }
    .footer { margin-top: 5rem; font-size: 0.8rem; color: #aaa; border-top: 1px solid #e0d8cc; padding-top: 2rem; }
  </style>
</head>
<body>

  <div class="nav">
    <a href="index.html">← Syllabus</a>
    <span id="unit-link"></span>
    <span id="raw-link"></span>
  </div>

  <div id="content">
    <p class="loading">Loading…</p>
  </div>

  <div class="footer">Eleven Million Lines You Should Know</div>

  <script>
    // ── Chipsquirt (JS port) ────────────────────────────────────────────────
    // h1  → fourth-power-interval (rare chromatic flashes, mostly near-black)
    // h2/h3 → orbit (3D Lissajous through HSV, golden ratio frequencies)

    const FAMILIES = {
      teal:    { hc: 172, hd: 12, sat: 70,  lc: 28, lr: 8 },
      slate:   { hc: 215, hd: 8,  sat: 40,  lc: 28, lr: 8 },
      forest:  { hc: 140, hd: 10, sat: 60,  lc: 25, lr: 8 },
      amber:   { hc: 36,  hd: 8,  sat: 75,  lc: 28, lr: 8 },
      violet:  { hc: 268, hd: 14, sat: 60,  lc: 26, lr: 8 },
      magenta: { hc: 312, hd: 10, sat: 65,  lc: 26, lr: 8 },
    };

    const UNIT_FAMILIES = {
      '01': 'teal',   '02': 'slate',  '03': 'forest', '04': 'amber',
      '05': 'violet', '06': 'magenta','07': 'teal',   '08': 'slate',
      '09': 'amber',  '10': 'forest', '11': 'violet',
    };

    function hsvToRgb(h, s, v) {
      h = ((h % 360) + 360) % 360;
      const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
      let r, g, b;
      if      (h < 60)  { r=c; g=x; b=0; }
      else if (h < 120) { r=x; g=c; b=0; }
      else if (h < 180) { r=0; g=c; b=x; }
      else if (h < 240) { r=0; g=x; b=c; }
      else if (h < 300) { r=x; g=0; b=c; }
      else              { r=c; g=0; b=x; }
      return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
    }

    function hslToRgb01(h, s, l) {
      // h degrees, s/l percent → [r,g,b] as 0–1 floats
      s /= 100; l /= 100;
      h = ((h % 360) + 360) % 360;
      const c = (1 - Math.abs(2*l - 1)) * s;
      const x = c * (1 - Math.abs((h / 60) % 2 - 1));
      const m = l - c / 2;
      let r, g, b;
      if      (h < 60)  { r=c; g=x; b=0; }
      else if (h < 120) { r=x; g=c; b=0; }
      else if (h < 180) { r=0; g=c; b=x; }
      else if (h < 240) { r=0; g=x; b=c; }
      else if (h < 300) { r=x; g=0; b=c; }
      else              { r=c; g=0; b=x; }
      return [r+m, g+m, b+m];
    }

    function letterColor(i, fam, mode, phase) {
      const { hc, hd, sat, lc, lr } = fam;
      const freq = 0.45;
      const PHI = 1.6180339887, PHI2 = 2.6180339887;

      if (mode === 'orbit') {
        const h_hsv = ((hc + hd * Math.sin(i * freq + phase)) % 360 + 360) % 360;
        let s_hsv = sat / 100 + 0.18 * Math.sin(i * freq * PHI  + phase + 1.1);
        let v_hsv = 0.30       + 0.18 * Math.sin(i * freq * PHI2 + phase + 2.3);
        s_hsv = Math.max(0, Math.min(1, s_hsv));
        v_hsv = Math.max(0.08, Math.min(0.60, v_hsv));
        const [r, g, b] = hsvToRgb(h_hsv, s_hsv, v_hsv);
        return `rgb(${r},${g},${b})`;
      }

      if (mode === 'fourth-power-interval') {
        const [ar, ag, ab] = hslToRgb01(hc, sat, Math.max(lc - lr, 6));
        const bh = hc + (Math.random() * 2 - 1) * hd;
        const bs = Math.min(sat + Math.random() * 15, 100);
        const bl = Math.min(lc + Math.random() * (lr * 3 + 8) + 8, 60);
        const [br, bg, bb] = hslToRgb01(bh, bs, bl);
        const t = Math.random(), t4 = t * t * t * t;
        const r = ar + t4 * (br - ar);
        const g = ag + t4 * (bg - ag);
        const b = ab + t4 * (bb - ab);
        return `rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`;
      }

      return `hsl(${hc},${sat}%,${lc}%)`;
    }

    function colorizeTextNode(textNode, fam, mode, counter, phase) {
      const text = textNode.nodeValue;
      const frag = document.createDocumentFragment();
      for (const ch of text) {
        if (/\s/.test(ch)) {
          frag.appendChild(document.createTextNode(ch));
        } else {
          const span = document.createElement('span');
          span.style.color = letterColor(counter.i++, fam, mode, phase);
          span.textContent = ch;
          frag.appendChild(span);
        }
      }
      textNode.parentNode.replaceChild(frag, textNode);
    }

    function colorizeElement(el, fam, mode) {
      const phase = Math.random() * Math.PI * 2;
      const counter = { i: 0 };
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      const nodes = [];
      let n;
      while ((n = walker.nextNode())) nodes.push(n);
      for (const node of nodes) colorizeTextNode(node, fam, mode, counter, phase);
    }

    function applyChipsquirt(unit) {
      const famName = UNIT_FAMILIES[unit] || 'teal';
      const fam = FAMILIES[famName];
      const content = document.getElementById('content');
      content.querySelectorAll('h1').forEach(el =>
        colorizeElement(el, fam, 'fourth-power-interval'));
      content.querySelectorAll('h2, h3').forEach(el =>
        colorizeElement(el, fam, 'orbit'));
    }

    // ── Page logic ──────────────────────────────────────────────────────────

    const REPO = "momahajogami/eleven-million-lines";
    const BRANCH = "main";
    const RAW_BASE = `https://raw.githubusercontent.com/${REPO}/${BRANCH}`;
    const GITHUB_BASE = `https://github.com/${REPO}/blob/${BRANCH}`;

    const params = new URLSearchParams(window.location.search);
    const file = params.get("file");

    if (!file) {
      document.getElementById("content").innerHTML =
        '<p class="error">No file specified. Add <code>?file=02/ZETTELKASTEN.md</code> to the URL.</p>';
    } else {
      const unit = file.match(/^(\d{2})\//)?.[1];
      if (unit) {
        document.getElementById("unit-link").innerHTML =
          `<a href="${unit}/index.html">Unit ${unit}</a>`;
      }
      document.getElementById("raw-link").innerHTML =
        `<a href="${GITHUB_BASE}/${file}" target="_blank">view on GitHub ↗</a>`;

      document.title = file.split("/").pop().replace(".md", "") + " — Eleven Million Lines";

      fetch(`${RAW_BASE}/${file}`)
        .then(r => {
          if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
          return r.text();
        })
        .then(md => {
          document.getElementById("content").innerHTML = marked.parse(md);
          if (unit) applyChipsquirt(unit);
        })
        .catch(err => {
          document.getElementById("content").innerHTML =
            `<p class="error">Could not load <code>${file}</code>: ${err.message}</p>`;
        });
    }
  </script>

</body>
</html>
