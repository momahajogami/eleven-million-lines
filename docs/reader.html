<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eleven Million Lines — Reader</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 18px; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #fdfaf5;
      color: #1a1a1a;
      line-height: 1.7;
      max-width: 720px;
      margin: 0 auto;
      padding: 4rem 2rem 6rem;
    }
    .nav {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 3rem;
      display: flex;
      gap: 1.5rem;
    }
    .nav a { color: #555; text-decoration: none; }
    .nav a:hover { text-decoration: underline; }
    #content h1 { font-size: 1.8rem; font-weight: normal; margin-bottom: 1.5rem; line-height: 1.2; }
    #content h2 { font-size: 1.2rem; font-weight: bold; margin: 2.5rem 0 0.75rem; }
    #content h3 { font-size: 1rem; font-weight: bold; margin: 2rem 0 0.5rem; }
    #content p { margin-bottom: 1.2rem; color: #333; }
    #content ul, #content ol { margin: 0 0 1.2rem 1.5rem; color: #333; }
    #content li { margin-bottom: 0.4rem; }
    #content code {
      font-family: "Courier New", monospace;
      font-size: 0.85em;
      background: #f0ece4;
      padding: 0.1em 0.35em;
      border-radius: 2px;
    }
    #content pre {
      background: #f0ece4;
      padding: 1.25rem;
      overflow-x: auto;
      margin-bottom: 1.5rem;
      border-left: 3px solid #c8bfb0;
    }
    #content pre code { background: none; padding: 0; font-size: 0.82em; }
    #content blockquote {
      border-left: 3px solid #c8bfb0;
      padding-left: 1.25rem;
      color: #666;
      margin-bottom: 1.2rem;
    }
    #content hr { border: none; border-top: 1px solid #e0d8cc; margin: 2.5rem 0; }
    #content strong { color: #1a1a1a; }
    #content em { font-style: italic; }
    #content a { color: #555; }
    #content table { border-collapse: collapse; width: 100%; margin-bottom: 1.5rem; font-size: 0.9rem; }
    #content th, #content td { border: 1px solid #e0d8cc; padding: 0.5rem 0.75rem; text-align: left; }
    #content th { background: #f0ece4; font-weight: bold; }
    .error { color: #a00; font-style: italic; }
    .loading { color: #888; font-style: italic; }
    .footer { margin-top: 5rem; font-size: 0.8rem; color: #aaa; border-top: 1px solid #e0d8cc; padding-top: 2rem; }
  </style>
</head>
<body>

  <div class="nav">
    <a href="index.html">← Syllabus</a>
    <span id="unit-link"></span>
    <span id="raw-link"></span>
  </div>

  <div id="content">
    <p class="loading">Loading…</p>
  </div>

  <div class="footer">Eleven Million Lines You Should Know</div>

  <script>
    const REPO = "momahajogami/eleven-million-lines";
    const BRANCH = "main";
    const RAW_BASE = `https://raw.githubusercontent.com/${REPO}/${BRANCH}`;
    const GITHUB_BASE = `https://github.com/${REPO}/blob/${BRANCH}`;

    const params = new URLSearchParams(window.location.search);
    const file = params.get("file");

    if (!file) {
      document.getElementById("content").innerHTML =
        '<p class="error">No file specified. Add <code>?file=02/ZETTELKASTEN.md</code> to the URL.</p>';
    } else {
      // populate nav links
      const unit = file.match(/^(\d{2})\//)?.[1];
      if (unit) {
        document.getElementById("unit-link").innerHTML =
          `<a href="${unit}/index.html">Unit ${unit}</a>`;
      }
      document.getElementById("raw-link").innerHTML =
        `<a href="${GITHUB_BASE}/${file}" target="_blank">view on GitHub ↗</a>`;

      document.title = file.split("/").pop().replace(".md", "") + " — Eleven Million Lines";

      fetch(`${RAW_BASE}/${file}`)
        .then(r => {
          if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
          return r.text();
        })
        .then(md => {
          document.getElementById("content").innerHTML = marked.parse(md);
        })
        .catch(err => {
          document.getElementById("content").innerHTML =
            `<p class="error">Could not load <code>${file}</code>: ${err.message}</p>`;
        });
    }
  </script>

</body>
</html>
